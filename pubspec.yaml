name: text_nexus
description: A comprehensive NLP-powered text processing application

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  google_sign_in: ^6.2.1
  
  # UI & Icons
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  
  # Image Picking
  image_picker: ^1.0.7
  
  # State Management
  provider: ^6.1.1
  
  # HTTP & API calls
  http: ^1.2.0
  
  # Video Processing
  video_player: ^2.8.2
  
  # Local Storage
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.8
  flutter_lints: ^3.0.0  # Add this line

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#800000"   # your maroon color
  adaptive_icon_foreground: "assets/images/logo.png"



flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/